# Models Configuration
models:
  # Feature engineering
  features:
    moving_averages: [5, 10, 20, 50, 100, 200]
    volatility_windows: [5, 10, 20, 50]
    momentum_windows: [5, 10, 20, 50]
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bollinger_period: 20
    bollinger_std: 2
    price_windows: [5, 10, 20, 50, 100]
    volume_windows: [5, 10, 20, 50]
  
  # Label generation
  labels:
    bubble_threshold: 0.2
    crash_threshold: -0.15
    lookforward_window: 20
    min_bubble_duration: 5
    min_crash_duration: 3
    trend_window: 200
    volatility_window: 20
    regime_threshold: 0.1
  
  # Model configurations
  detectors:
    moving_average:
      short_window: 50
      long_window: 200
      threshold: 1.2
    
    technical_indicator:
      rsi_threshold: 70
      macd_threshold: 0
      bb_threshold: 0.95
      volatility_threshold: 1.5
    
    logistic_regression:
      C: 1.0
      max_iter: 1000
      random_state: 42
    
    random_forest:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 5
      min_samples_leaf: 2
      random_state: 42
    
    xgboost:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
    
    lightgbm:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
    
    ensemble:
      models: ["logistic", "random_forest", "xgboost"]
      weights: null  # Equal weights if null
      voting: "soft"
  
  # Training
  training:
    test_size: 0.2
    validation_size: 0.1
    random_state: 42
    time_series_split: true
    n_splits: 5
