[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-price-bubble-detection"
version = "1.0.0"
description = "Asset Price Bubble Detection - Research Demo (Not Investment Advice)"
authors = [
    {name = "Research Team", email = "research@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
    # "pmdarima>=2.0.0",  # Commented out due to build issues
    # "tsfresh>=0.20.0",  # Commented out due to build issues
    "arch>=6.2.0",
    "yfinance>=0.2.0",
    "streamlit>=1.28.0",
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.4.0",
    "mypy>=1.5.0",
]
torch = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
]
nlp = [
    "transformers>=4.30.0",
    "datasets>=2.14.0",
    "beautifulsoup4>=4.12.0",
    "spacy>=3.6.0",
]
backtesting = [
    "vectorbt>=0.25.0",
    "backtrader>=1.9.0",
]
portfolio = [
    "cvxpy>=1.3.0",
    "riskfolio-lib>=4.3.0",
    "PyPortfolioOpt>=1.5.0",
]
tracking = [
    "mlflow>=2.5.0",
    "wandb>=0.15.0",
]
serving = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/example/asset-price-bubble-detection"
Repository = "https://github.com/example/asset-price-bubble-detection"
Documentation = "https://github.com/example/asset-price-bubble-detection#readme"
Issues = "https://github.com/example/asset-price-bubble-detection/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "plotly.*",
    "streamlit.*",
    "pmdarima.*",
    "tsfresh.*",
    "arch.*",
]
ignore_missing_imports = true
